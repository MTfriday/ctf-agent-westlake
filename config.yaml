# CTF Agent — 主配置文件
# 可被 .env 环境变量覆盖

# ========== 比赛平台 API ==========
platform:
  # 平台类型: "generic" | "ctfd" | "ctf2" | "gzctf"
  type: "gzctf"

  # ===== GZCTF 配置 (type=gzctf) =====
  # 凭据从 .env 读取：GZCTF_USERNAME / GZCTF_PASSWORD（会话登录）或 GZCTF_TOKEN（推荐）
  auth_type: "Bearer"
  api_base_url: "http://150.158.131.227:65534"   # GZCTF 基础URL

  # ===== CTF2 配置 (type=ctf2) =====
  # 认证方式（推荐：ApiKey → X-CTF2-API-Key header）
  # auth_type: "ApiKey"                       # "ApiKey" | "Bearer"
  # auth_credential: ""                       # SECRET — 从 .env 的 PLATFORM_AUTH_CREDENTIAL 读取
  # api_base_url: "https://ctf2.dasctf.com"   # CTF2 基础URL
  # api_path: "/api/open/v1"                  # CTF2 API 路径前缀

  # ===== 通用 API 配置（type=generic 时生效）=====
  # api_base_url: ""                         # 赛事平台API基础URL
  # auth_type: "Bearer"                      # "Bearer" | "ApiKey" | "Header"
  # auth_credential: ""                      # 认证凭证（从 .env PLATFORM_AUTH_CREDENTIAL 读取）
  # endpoints:
  #   list_challenges: "/api/challenges"     # 获取题目列表
  #   get_challenge: "/api/challenge"        # 获取单题详情（支持 ?id=xxx）
  #   download_attachment: "/api/attachment" # 下载附件（支持 ?id=xxx）
  #   submit_flag: "/api/flag"               # 提交Flag

# ========== LLM 配置 ==========
llm:
  # OpenAI 兼容接口（阿里百炼使用此模式）
  bailian:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # API Key 通过环境变量 BAILIAN_API_KEY 设置
    default_model: "qwen-max"

  # 其他 LLM 提供商通过 .env 配置

# ========== 求解器配置 ==========
solver:
  max_concurrent_challenges: 10              # 最大并发解题数
  max_attempts_per_challenge: 3              # 每题最多尝试次数
  model_temperature: 0.7                     # 模型温度
  retry_delay_seconds: 30                    # 重试间隔
  # 模型选择（逗号分隔，留空=自动检测可用provider）
  # 没有 claude/codex CLI 时会自动回退到 OpenAI 兼容 API
  # 示例: "deepseek/deepseek-v4-flash,deepseek/deepseek-v4-pro"
  models: ""

  # Coordinator 后端: "claude" | "codex" | "pydantic" | "auto"
  # pydantic 可用任意 OpenAI 兼容模型（DeepSeek/百炼），无需 claude/codex CLI
  coordinator: "auto"
  # Coordinator 使用的模型（仅 pydantic 后端生效），如 "deepseek/deepseek-v4-flash"
  coordinator_model: ""
  # 操作员消息 HTTP 端口（仪表盘 ↔ 引擎通信，两端必须一致）
  operator_msg_port: 9400

# ========== Flag 配置 ==========
flag:
  # Flag 校验正则（可为空以禁用校验）
  pattern: ""
  # 默认模式（启用时使用）: "[A-Za-z0-9_{}!@#$%^&*()\\-+]+"
  min_length: 1

# ========== 速率限制 ==========
rate_limit:
  enabled: true
  requests_per_second: 5                     # 每秒最大请求数
  burst_size: 10                             # 突发允许量

# ========== 沙箱配置 ==========
sandbox:
  image: "ctf-sandbox"
  memory_limit: "16g"
  cpu_limit: 2                               # CPU 核心数
  # 危险命令黑名单（正则匹配）
  dangerous_commands:
    - "^rm\\s+-rf\\s+/\\s*$"                 # rm -rf /
    - "^mkfs\\."                             # 格式化文件系统
    - "^dd\\s+if=/dev/zero"                  # 覆写磁盘
    - "^fdisk\\s"                            # 分区操作
    - "^:(){ :\\|:& };:"                     # Fork 炸弹
  # 网络白名单（空 = 仅允许题目环境）
  network_whitelist: []

# ========== 仪表盘 ==========
dashboard:
  enabled: true
  port: 8501
  refresh_interval_seconds: 3

# ========== Aemeath 执行层适配器 ==========
adapter:
  host: "127.0.0.1"
  port: 8001
  # 引擎后端: "swarm"（真实求解）| "mock"（联调/测试，无需平台与 LLM）
  engine_backend: "swarm"

# ========== Aemeath 总控（OODA 循环 + 模式路由）==========
orchestrator:
  enabled: true
  # 主力规划模型（百炼 qwen；未配 BAILIAN_API_KEY 时自动回退规则）
  main_model: "qwen3.7-max"
  # 模式路由模型
  router_model: "qwen3.6-flash"
  max_intents: 4                  # 每轮最多生成 Intent 数
  intent_timeout_seconds: 120     # Intent 执行超时（秒）
  observe_interval_seconds: 10    # OODA 轮询间隔（秒）
  max_rounds: 20                  # 最大循环轮数

# ========== Aemeath 共享黑板 ==========
blackboard:
  # SQLite 数据库路径（环境变量 AEMEATH_BLACKBOARD_PATH 优先）
  # 容器化时通过 Docker Volume 挂载此路径，确保容器间共享
  db_path: "data/blackboard.db"

# ========== 日志 ==========
logging:
  level: "INFO"                              # DEBUG | INFO | WARNING | ERROR
  trace_enabled: true
